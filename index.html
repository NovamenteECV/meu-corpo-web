try{const y=new Date(Date.now()-24*3600e3).toISOString(),sl=await H.readSamples({dataType:"sleep",startDate:y,endDate:now,limit:500});let min=0;(sl.samples||[]).forEach(s=>{if(s.stages&&s.stages.length)s.stages.forEach(g=>{if(!["inBed","awake"].includes(g.stage))min+=g.durationMinutes||0});else if(!["inBed","awake"].includes(s.sleepState||"asleep"))min+=(new Date(s.endDate)-new Date(s.startDate))/6e4});if(min>30){L.sono=Math.round(min)/60;r.push(fhm(L.sono)+" de sono")}}catch(e){}
try{const w=await H.readSamples({dataType:"weight",startDate:st,endDate:now,limit:1,ascending:false});const s=(w.samples||[])[0];if(s&&s.value>40&&s.value<250){L.peso=Math.round(s.value*100)/100;r.push(f1(L.peso,1)+" kg")}}catch(e){}
try{const h=await H.readSamples({dataType:"restingHeartRate",startDate:new Date(Date.now()-48*3600e3).toISOString(),endDate:now,limit:1,ascending:false});const s=(h.samples||[])[0];if(s&&s.value>30){L.fcr=Math.round(s.value);r.push("FC repouso "+L.fcr)}}catch(e){}
S.hk={d,h:new Date().toTimeString().slice(0,5),r:r.join(" · ")||"sem dados novos"};sv();draw(1);if(manual)toast(r.length?"✅ Saúde: "+r.join(" · "):"O Saúde não tem dados novos de hoje.")}catch(e){if(manual)toast("Não consegui ler o Saúde. Confira as permissões do Saúde (no Android: Health Connect).")}}

if(list.length)await N.schedule({notifications:list});toast(list.length?`🔔 ${list.length} lembretes ativos`:"Lembretes desligados")}catch(e){toast("Não consegui agendar os lembretes.")}}

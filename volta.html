<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="VALLEN TECNOLOGIA">
<meta name="robots" content="noindex">
<title>Vallen Fitness</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:linear-gradient(160deg,#0f766e,#134e4a);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a}
.bx{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.logo{width:56px;height:56px;border-radius:16px}
h1{font-size:23px;margin:10px 0 4px;color:#0f766e}
p{margin:0 0 18px;color:#64748b;font-size:14.5px}
a.pri{display:block;background:#0d9488;color:#fff;border-radius:12px;padding:15px;font-weight:700;text-decoration:none}
.m{margin:14px 0 0;font-size:13px}
.assin{margin-top:18px;color:rgba(255,255,255,.75);font-size:12px}.assin b{color:#fff;letter-spacing:.05em}
</style></head>
<body>
<div class="bx"><img class="logo" src="icon-192.png" alt=""><h1 id="t">Login feito</h1><p id="d">Voltando para o app Vallen Fitness…</p><a class="pri" id="ir" href="#">Voltar para o app</a><p class="m" id="m">Se o app não abrir sozinho, toque no botão. Depois, pode fechar esta aba.</p></div>
<p class="assin">Criado e desenvolvido por <b>VALLEN TECNOLOGIA</b></p>
<script>
/* Volta do login com Google para o APK. O Supabase manda para cá (endereço do próprio site, sempre aceito)
   e esta página passa a sessão para o app pelo link com.andremeucorpo.app://login. */
(function () {
  var h = location.hash, q = location.search, erro = /error/.test(h + q);
  // dados da sessão vão na consulta (?...), que passa inteira pelo intent do Android
  var dados = [q && /code=/.test(q) ? q.slice(1) : "", h ? h.slice(1) : ""].filter(Boolean).join("&");
  var esquema = "com.andremeucorpo.app://login" + (dados ? "?" + dados : "");
  var android = /Android/i.test(navigator.userAgent);
  // intent:// aponta direto para o pacote do app: funciona no Chrome e nos navegadores baseados nele (inclusive o do Xiaomi)
  var alvo = android ? "intent://login" + (dados ? "?" + dados : "") + "#Intent;scheme=com.andremeucorpo.app;package=com.andremeucorpo.app;end" : esquema;
  history.replaceState(null, "", location.pathname);   // tira os dados da sessão da barra de endereço
  if (erro) {
    var p = new URLSearchParams(dados);
    document.getElementById("t").textContent = "Não deu certo";
    document.getElementById("d").textContent = p.get("error_description") || "O login com o Google foi cancelado.";
  } else if (!/access_token=|code=/.test(dados)) {
    document.getElementById("t").textContent = "Vallen Fitness";
    document.getElementById("d").textContent = "Abra o app e entre de novo.";
  }
  document.getElementById("ir").href = erro ? esquema.split("?")[0] : alvo;
  if (!erro && dados) setTimeout(function () { location.href = alvo }, 150);
})();
</script>
</body></html>
